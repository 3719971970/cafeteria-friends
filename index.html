<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Perk ☕ Friends</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:'Poppins',Arial;margin:0;background:#fdf3e7;color:#2d2a26}
header{background:#3b2314;color:white;padding:28px 15px 32px;text-align:center;border-radius:0 0 30px 30px}
header h1{font-family:'Playfair Display',serif;font-size:34px;margin:0}
header h1 span{color:#ff8c00}
header p{opacity:.9;margin:6px 0 0}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.07);margin-bottom:18px}
.card h3{margin-top:0;color:#3b2314}
input,select{width:100%;padding:12px;margin:6px 0;border:1.5px solid #eee;border-radius:12px;font-family:inherit;background:#fffaf3}
.row{display:flex;gap:10px}
.row>*{flex:1}
button{border:none;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:600;font-family:inherit}
.btn-principal{background:#ff6b00;color:white;width:100%;font-size:16px}
.btn-limpar{background:#eee;width:100%;margin-top:8px}
.alerta{background:#fff3cd;border:1px solid #ffe69c;padding:12px;border-radius:12px;text-align:center;font-weight:600;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}
.item{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.07);display:flex;flex-direction:column}
.capa{height:120px;display:flex;align-items:center;justify-content:center;font-size:55px;background:linear-gradient(135deg,#ff9a3d,#ff6b00)}
.capa.cat-Cafés{background:linear-gradient(135deg,#8b5a2b,#3b2314)}
.capa.cat-Doces{background:linear-gradient(135deg,#ff8fab,#ff4d6d)}
.capa.cat-Salgados{background:linear-gradient(135deg,#fbbf24,#f97316)}
.capa.cat-Bebidas{background:linear-gradient(135deg,#38bdf8,#0369a1)}
.capa.cat-Central-Perk{background:linear-gradient(135deg,#a78bfa,#6d28d9)}
.conteudo{padding:14px;flex:1;display:flex;flex-direction:column}
.conteudo b{font-size:16px}
.autor{color:#888;font-size:13px;margin:4px 0}
.categoria{display:inline-block;background:#fdf0e3;color:#b45309;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;width:fit-content}
.preco{font-size:20px;font-weight:700;color:#15803d;margin-top:8px}
.estoque{font-size:12px;margin:4px 0}
.estoque.baixo{color:#dc2626;font-weight:700}
.acoes{display:flex;gap:8px;margin-top:10px}
.acoes button{flex:1;padding:9px}
.editar{background:#fef3c7}
.excluir{background:#fee2e2}
footer{text-align:center;padding:20px;color:#999;font-size:13px}
@media(max-width:600px){.row{flex-direction:column}}
</style>
</head>
<body>
<header>
<h1>☕ CENTRAL <span>PERK</span></h1>
<p>Could this BE any more delicious? - A cafeteria do Friends!</p>
<p style="font-size:13px;margin-top:10px">🛋️ O sofá laranja te espera! • Pedras de Fogo</p>
</header>

<div class="container">
<div id="alerta"></div>

<div class="card">
<h3>➕ Cadastrar item da cafeteria</h3>
<input type="hidden" id="editId">
<input id="nome" placeholder="Nome * Ex: Café Central Perk / Muffin da Phoebe">
<div class="row">
<input id="categoria" placeholder="Categoria Ex: Cafés">
<input id="marca" placeholder="Marca / Fornecedor Ex: Central Perk">
</div>
<div class="row">
<input id="modelo" placeholder="Modelo / Tamanho Ex: Grande, Médio, Pequeno">
<input id="codigo" placeholder="Código Ex: CP001">
</div>
<div class="row">
<input id="quantidade" type="number" placeholder="Quantidade em estoque">
<input id="preco_custo" type="number" step="0.01" placeholder="Preço de custo Ex: 4.00">
<input id="preco_venda" type="number" step="0.01" placeholder="Preço de venda Ex: 12.90">
</div>
<button class="btn-principal" onclick="salvar()">💾 Salvar Item</button>
<button class="btn-limpar" onclick="limpar()">Limpar</button>
</div>

<div class="card">
<input id="busca" placeholder="🔍 Buscar por nome, marca ou código..." oninput="carregar()">
<select id="filtro" onchange="carregar()">
<option value="">Todas as categorias</option>
<option>Cafés</option>
<option>Doces</option>
<option>Salgados</option>
<option>Bebidas</option>
<option>Central Perk</option>
</select>
<label style="font-size:13px"><input type="checkbox" id="soBaixo" onchange="carregar()"> Mostrar só estoque baixo</label>
</div>

<div id="lista" class="grid"></div>
</div>

<footer>Central Perk ☕ • How you doin'? • Feito com ❤️</footer>

<script>
// ===== CONFIGURAÇÃO - AQUI TU COLOCA TUA URL E TUA CHAVE =====
const SUPABASE_URL = "https://oxjemqeekrvhhddcjsjm.supabase.co";
const SUPABASE_KEY = "sb_publishable_NLHoVtP6lDUpfDGaFwElew_3OX8CWc5";
// NUNCA coloque a chave service_role aqui! Só a publishable / anon
// ==============================================================
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function emojiPorCategoria(cat, nome){
  if((nome||'').toLowerCase().includes('café') || (nome||'').toLowerCase().includes('cafe')) return '☕';
  if(cat==='Cafés') return '☕';
  if(cat==='Doces') return '🧁';
  if(cat==='Salgados') return '🥐';
  if(cat==='Bebidas') return '🥤';
  if(cat==='Central Perk') return '🛋️';
  return '🍰';
}

async function carregar(){
  const {data, error} = await supabaseClient.from('cafeteria').select('*').order('created_at',{ascending:false});
  if(error){alert(error.message); return;}
  const busca = document.getElementById('busca').value.toLowerCase();
  const filtro = document.getElementById('filtro').value;
  const soBaixo = document.getElementById('soBaixo').checked;

  let filtrados = data.filter(p => {
    let okBusca = (p.nome||'').toLowerCase().includes(busca) || (p.marca||'').toLowerCase().includes(busca) || (p.codigo||'').toLowerCase().includes(busca);
    let okCat = !filtro || p.categoria === filtro;
    let okBaixo = !soBaixo || p.quantidade < 5;
    return okBusca && okCat && okBaixo;
  });

  let baixos = data.filter(p => p.quantidade < 5);
  document.getElementById('alerta').innerHTML = baixos.length ? `<div class="alerta">⚠️ Atenção! ${baixos.length} item(s) com estoque baixo (menos de 5) - O Gunther precisa repor!</div>` : '';

  document.getElementById('lista').innerHTML = filtrados.map(p => `
    <div class="item">
      <div class="capa cat-${p.categoria||''}">${emojiPorCategoria(p.categoria, p.nome)}</div>
      <div class="conteudo">
        <span class="categoria">${p.categoria||'Geral'}</span>
        <b>${p.nome}</b>
        <div class="autor">${p.marca||''} ${p.modelo||''} • Cód: ${p.codigo||'-'}</div>
        <div class="preco">R$ ${Number(p.preco_venda||0).toFixed(2)}</div>
        <div style="font-size:12px;color:#666">Custo: R$ ${Number(p.preco_custo||0).toFixed(2)} | Lucro: R$ ${(p.preco_venda - p.preco_custo).toFixed(2)}</div>
        <div class="estoque ${p.quantidade<5?'baixo':''}">${p.quantidade<5?'⚠️ ESTOQUE BAIXO! ':''} ${p.quantidade} em estoque</div>
        <div class="acoes">
          <button class="editar" onclick="editar(${p.id})">Editar</button>
          <button class="excluir" onclick="excluir(${p.id})">Excluir</button>
        </div>
      </div>
    </div>`).join('') || '<p style="text-align:center">Nenhum item encontrado. Cadastra o primeiro café! ☕</p>';
}

async function salvar(){
  const id = document.getElementById('editId').value;
  const item = {
    nome: document.getElementById('nome').value,
    categoria: document.getElementById('categoria').value,
    marca: document.getElementById('marca').value,
    modelo: document.getElementById('modelo').value,
    codigo: document.getElementById('codigo').value,
    quantidade: Number(document.getElementById('quantidade').value) || 0,
    preco_custo: Number(document.getElementById('preco_custo').value) || 0,
    preco_venda: Number(document.getElementById('preco_venda').value) || 0
  };
  if(!item.nome){alert('Coloca o nome!'); return;}
  let res = id ? await supabaseClient.from('cafeteria').update(item).eq('id', id) : await supabaseClient.from('cafeteria').insert([item]);
  if(res.error) alert(res.error.message); else { limpar(); carregar(); }
}

async function editar(id){
  const {data} = await supabaseClient.from('cafeteria').select('*').eq('id', id).single();
  document.getElementById('editId').value = data.id;
  document.getElementById('nome').value = data.nome;
  document.getElementById('categoria').value = data.categoria||'';
  document.getElementById('marca').value = data.marca||'';
  document.getElementById('modelo').value = data.modelo||'';
  document.getElementById('codigo').value = data.codigo||'';
  document.getElementById('quantidade').value = data.quantidade;
  document.getElementById('preco_custo').value = data.preco_custo;
  document.getElementById('preco_venda').value = data.preco_venda;
  window.scrollTo(0,0);
}

async function excluir(id){
  if(!confirm('Excluir esse item?')) return;
  await supabaseClient.from('cafeteria').delete().eq('id', id);
  carregar();
}

function limpar(){
  document.getElementById('editId').value='';
  ['nome','categoria','marca','modelo','codigo','quantidade','preco_custo','preco_venda'].forEach(i=>document.getElementById(i).value='');
}
carregar();
</script>
</body>
</html>
